<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <p class="eyebrow">Private research workspace</p>
    <h1 id="login-title">Sign in to Argos</h1>
    <p class="intro">Use the configured administrator credentials.</p>

    @if (session.restorationUnavailable()) {
      <div class="session-warning" role="alert">
        <p>Argos authentication is unavailable. Try again.</p>
        <button type="button" [disabled]="pending()" (click)="retrySession()">
          {{ pending() ? 'Retrying session…' : 'Retry session' }}
        </button>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        required
      />

      <label for="password">Password</label>
      <input
        #passwordInput
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
      />

      <button type="submit" [disabled]="pending() || form.invalid">
        {{ pending() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="error" role="alert" aria-live="polite">{{ errorMessage() }}</p>
  </section>
</main>
